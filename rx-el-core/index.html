<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode File Upload</title>
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: 'Arial', sans-serif;
          background-color: #1e1e1e;
          color: #fff;
        }

        .container {
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }

        #fileInput {
          display: none;
        }

        .upload-btn-wrapper {
          position: relative;
          overflow: hidden;
          display: inline-block;
        }

        .btn {
          border: 2px solid gray;
          color: gray;
          background-color: #fff;
          padding: 8px 20px;
          border-radius: 8px;
          font-size: 16px;
          font-weight: bold;
        }

        .upload-btn-wrapper input[type=file] {
          font-size: 100px;
          position: absolute;
          left: 0;
          top: 0;
          opacity: 0;
        }

        /* Dark mode styling */
        .dark-mode {
          background-color: #121212;
          color: #fff;
          transition: background-color 0.5s ease, color 0.5s ease;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="upload-btn-wrapper">
        <button class="btn" onclick="openFileInput()">Upload a file</button>
        <input type="file" name="file" id="fileInput" onchange="handleFileUpload()">
    </div>
</div>

<script>
    function openFileInput() {
      const fileInput = document.getElementById('fileInput');
      fileInput.click();
    }

    function handleFileUpload() {
      const fileInput = document.getElementById('fileInput');
      const selectedFile = fileInput.files[0];

      if (selectedFile) {
        alert(`File uploaded: ${selectedFile.name}`);
        // Add additional logic for handling the uploaded file as needed
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }
</script>
</body>
</html>
