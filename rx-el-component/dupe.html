<!DOCTYPE html>
<html lang="en" theme="default">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rxel components</title>
    <link href="./styles/index.css" rel="stylesheet"/>
</head>
<body>
    <header>
        <nav class="nav">
            <div class="column">
                <ul class="nav-list">
                    <li class="nav-link">
                        <a class="nav-link-icon"
                           title="Device status">
                            <device-status class="device-status"></device-status>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a class="nav-link-icon"
                           id="home-icon"
                           title="Home"></a>
                    </li>
                    <li class="nav-link">
                        <a class="nav-link-icon"
                           id="table-icon"
                           title="Table"></a>
                    </li>
                    <li class="nav-link">
                        <section>
                            <div class="column">
                                <div class="collapsible-panel">
                                    <label for="toggle-details-checkbox"
                                           class="toggle-label nav-link-icon toggle-details-label"
                                           id="toggle-details-label"></label>
                                    <input type="checkbox"
                                           class="toggle-checkbox toggle-details-checkbox"
                                           id="toggle-details-checkbox"/>

                                    <div class="panel-body">
                                        <div class="column">
                                            <div class="content">
                                                <ul class="device-details-list">
                                                    <li>
                                                        <device-details class="device-details" src="/api/register/cpu"></device-details>
                                                    </li>
                                                    <li>
                                                        <device-details class="device-details" src="/api/register/memory"></device-details>
                                                    </li>
                                                    <li>
                                                        <device-details class="device-details" src="/api/register/process"></device-details>
                                                    </li>
                                                    <li>
                                                        <device-details class="device-details" src="/api/register/network"></device-details>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </li>
                    <li class="nav-link">
                        <a class="nav-link-icon"
                           id="chart-icon"
                           title="Kibana"></a>
                    </li>
                    <li class="nav-link">
                        <theme-toggle>
                            <label for="toggle-theme-checkbox"
                                   class="toggle-label nav-link-icon toggle-theme-label"
                                   id="toggle-theme-label"></label>
                            <input type="checkbox"
                                   class="toggle-checkbox toggle-theme-checkbox"
                                   id="toggle-theme-checkbox"/>
                        </theme-toggle>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="grid">
        <article>
            <section>
                <device-register class="device-register"></device-register>
            </section>
        </article>
    </main>

    <footer>
        <div class="column">
            <div class="content">
                <device-terminal class="device-terminal"></device-terminal>
            </div>
        </div>
    </footer>

    <!-- Component class script reference -->
    <script type="module" src="components/base/c-icon.js"></script>
    <script type="module" src="components/base/c-checkbox-select.js"></script>
    <script type="module" src="components/base/c-radio-select.js"></script>
    <script type="module" src="components/base/c-overlay.js"></script>

    <script type="module" src="components/device-terminal.js"></script>
    <script type="module" src="components/theme-toggle.js"></script>
    <script type="module" src="components/device-register.js"></script>
    <script type="module" src="components/device-create-register-form.js"></script>

    <script type="module" src="components/reactive/device-status.js"></script>
    <script type="module" src="components/reactive/device-details.js"></script>
    <script type="module" src="components/reactive/device-register-filter.js"></script>
    <script type="module" src="components/reactive/device-register-search.js"></script>
    <script type="module" src="components/reactive/device-register-table.js"></script>
    <script type="module" src="components/reactive/device-register-table-pagination.js"></script>
</body>
</html>
